# Builds and uploads the package to PyPI.
# The wheel bundles the dashboard web UI, so the frontend must be built
# before the Python package; a parity gate compares the artifacts against
# the committed baseline manifest before anything is uploaded.

name: Upload Python Package

on: workflow_dispatch

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        python-version: "3.12"
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
    - name: Build frontend (bundled into the wheel)
      working-directory: frontend
      run: |
        npm ci || npm install
        npm run build
    - name: Build package
      run: uv build
    - name: Parity gate against poetry baseline
      run: |
        uv sync --locked --no-build
        uv run --locked --no-build python scripts/compare_wheel_contents.py dist/*.whl --sdist dist/*.tar.gz
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
