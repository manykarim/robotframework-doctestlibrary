name: CI

# pull_request covers PR branches; push only on main — otherwise every PR
# commit runs the whole pipeline twice (doubling cost and exposure to
# live-LLM test flakiness).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: ruff
        run: uvx ruff check DocTest
      - name: mypy
        run: |
          uv sync --locked --no-build --all-extras
          uv run --locked --no-build --with mypy mypy DocTest
      - name: pip-audit
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip
        continue-on-error: true

  smoke-no-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Packages and Binaries
        run: |
          sudo apt-get update
          echo "Install Dependencies via apt"
          sudo apt-get install -y imagemagick tesseract-ocr ghostscript libdmtx0b libzbar0
          echo "Download Ghostscript and GhostPCL"
          export release_name=gs9561
          export archive_name=ghostpcl-9.56.1-linux-x86_64
          wget https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/${release_name}/${archive_name}.tgz
          tar -xvzf ${archive_name}.tgz
          chmod +x ${archive_name}/gpcl6*
          cp ${archive_name}/gpcl6* ${archive_name}/pcl6
          sudo cp ${archive_name}/* /usr/bin
          sudo cp policy.xml "$(ls -d /etc/ImageMagick-* | head -n 1)/"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
      - name: Install base dependencies (without AI extras)
        run: uv sync --locked --no-build
      - name: Run smoke end-to-end tests without AI extras
        run: |
          uv run --locked --no-build robot \
            --loglevel=TRACE:INFO \
            --listener RobotStackTracer \
            --xunit xunit.xml \
            -d results-smoke \
            atest/Compare.robot \
            atest/PdfContent.robot \
            atest/ReferenceRun.robot \
            atest/ResultJson.robot
      - name: Store Smoke Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: smoke-results
          path: |
            results-smoke/*.html
            results-smoke/output.xml
            results-smoke/xunit.xml
      - name: Smoke Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: Smoke Tests
          path: results-smoke/xunit.xml
          reporter: java-junit

  test:
    needs: smoke-no-ai
    # Required matrix runs WITHOUT live-LLM access: a paid external service
    # must not gate every PR on every interpreter. LLM coverage lives in the
    # separate non-required llm-tests job below.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Packages and Binaries
        run: |
          sudo apt-get update
          echo "Install Dependencies via apt"
          sudo apt-get install -y imagemagick tesseract-ocr ghostscript libdmtx0b libzbar0
          echo "Download Ghostscript and GhostPCL"
          export release_name=gs9561
          export archive_name=ghostpcl-9.56.1-linux-x86_64
          wget https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/${release_name}/${archive_name}.tgz
          tar -xvzf ${archive_name}.tgz
          chmod +x ${archive_name}/gpcl6*
          cp ${archive_name}/gpcl6* ${archive_name}/pcl6
          sudo cp ${archive_name}/* /usr/bin
          sudo cp policy.xml "$(ls -d /etc/ImageMagick-* | head -n 1)/"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (all extras)
        run: uv sync --locked --no-build --all-extras --python ${{ matrix.python-version }}
      - name: Audit resolved dependency versions
        run: uv run --locked --no-build python scripts/audit_resolved_versions.py
      - name: Run tests
        run: |
          uv run --locked --no-build invoke tests
      - name: Store Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: test-results ${{ matrix.python-version }} # Choose a descriptive name for your artifact
          path: |
            results/*.html
            results/*.xml
            results/htmlcov/
            results/*.prof
            results/*.txt
            results/screenshots/
      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure() # run this step even if previous step failed
        with:
          name: xUnit Tests ${{ matrix.python-version }} # Name of the check run which will be created
          path: results/pytest.xml,results/xunit.xml # Path to test results
          reporter: java-junit # Format of test results

  llm-tests:
    # Optional: exercises the live-LLM paths on one interpreter. Not a
    # required check — external model availability must not block merges.
    needs: smoke-no-ai
    continue-on-error: true
    env:
      DOCTEST_LLM_MODEL: ${{ vars.DOCTEST_LLM_MODEL }}
      DOCTEST_LLM_VISION_MODEL: ${{ vars.DOCTEST_LLM_VISION_MODEL }}
      DOCTEST_LLM_PROVIDER: ${{ vars.DOCTEST_LLM_PROVIDER }}
      DOCTEST_LLM_ENABLED: true
      DOCTEST_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      DOCTEST_LLM_BASE_URL: https://openrouter.ai/api/v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Packages and Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick tesseract-ocr ghostscript libdmtx0b libzbar0
          export release_name=gs9561
          export archive_name=ghostpcl-9.56.1-linux-x86_64
          wget https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/${release_name}/${archive_name}.tgz
          tar -xvzf ${archive_name}.tgz
          chmod +x ${archive_name}/gpcl6*
          cp ${archive_name}/gpcl6* ${archive_name}/pcl6
          sudo cp ${archive_name}/* /usr/bin
          sudo cp policy.xml "$(ls -d /etc/ImageMagick-* | head -n 1)/"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.15"
      - name: Install dependencies (all extras)
        run: uv sync --locked --no-build --all-extras
      - name: Run tests with live LLM
        run: uv run --locked --no-build invoke tests
      - name: Store LLM Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: llm-test-results
          path: |
            results/*.html
            results/*.xml

  windows:
    # Gates Windows wheel availability on the newest interpreter (issue #136)
    # and Windows-only behavior (paths, console encodings). The acceptance
    # suites need Ghostscript/GhostPCL/ImageMagick and stay on Linux.
    needs: smoke-no-ai
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tesseract
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.15"
      - name: Install dependencies (all extras)
        run: uv sync --locked --no-build --all-extras --python 3.15
      - name: Audit resolved dependency versions
        run: uv run --locked --no-build python scripts/audit_resolved_versions.py
      - name: Unit tests
        run: uv run --locked --no-build pytest utest -n auto --timeout=300 --junitxml=results/pytest-windows.xml
      - name: Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: success() || failure()
        with:
          name: Windows Unit Tests
          path: results/pytest-windows.xml
          reporter: java-junit

  dashboard:
    needs: smoke-no-ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Packages and Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick tesseract-ocr ghostscript libdmtx0b libzbar0
          sudo cp policy.xml "$(ls -d /etc/ImageMagick-* | head -n 1)/"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      - name: Sync environment (all extras)
        run: uv sync --locked --no-build --all-extras
      - name: Backend tests
        run: uv run --locked --no-build pytest utest/dashboard -v
      - name: Wheel parity gate
        run: |
          uv build
          uv run --locked --no-build python scripts/compare_wheel_contents.py dist/*.whl --sdist dist/*.tar.gz
      - name: Install Playwright browser
        run: uv run --locked --no-build playwright install chromium --with-deps
      - name: End-to-end journeys
        run: uv run --locked --no-build pytest e2e -v --browser chromium

  web:
    needs: smoke-no-ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Packages and Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick tesseract-ocr ghostscript libdmtx0b libzbar0
          sudo cp policy.xml "$(ls -d /etc/ImageMagick-* | head -n 1)/"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Sync environment (web test group)
        run: uv sync --locked --no-build --group web-test
      - name: Initialize Browser library
        run: uv run --locked --no-build rfbrowser init chromium firefox
      - name: Web capture unit tests
        run: uv run --locked --no-build pytest utest/test_web_visual.py -v
      - name: Web visual acceptance (Browser + SeleniumLibrary)
        run: uv run --locked --no-build robot -d results-web atest/web/
      - name: Store Web Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-results
          path: |
            results-web/*.html
            results-web/output.xml
